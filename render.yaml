# Render Blueprint: one web service runs the dashboard AND the Telegram bot.
services:
  - type: web
    name: doctor-feedback
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ANON_SALT
        generateValue: true
      - key: DASHBOARD_USERS
        sync: false
      - key: DASHBOARD_SECRET
        generateValue: true
      - key: ALERT_CHAT_ID
        sync: false
